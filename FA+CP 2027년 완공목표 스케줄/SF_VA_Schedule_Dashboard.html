body{font-family:'Segoe UI',Arial,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{background:linear-gradient(135deg,#1e293b,#334155);padding:20px 30px;border-bottom:2px solid #3b82f6;display:flex;justify-content:space-between;align-items:center}

.sidebar h3{padding:14px 16px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.bldg-group{margin-bottom:4px}
.bldg-label{padding:8px 16px;color:#cbd5e1;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.bldg-label:hover{background:#334155}
.zone-btn{padding:6px 16px 6px 32px;color:#94a3b8;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-left:2px solid transparent;transition:all .15s}
.zone-btn:hover{background:#334155;color:#e2e8f0}
.zone-btn.active{background:#1e3a5f;color:#60a5fa;border-left-color:#3b82f6}
.zone-btn .floor-tag{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:600}
.floor-gf{background:#065f46;color:#34d399}
.floor-ff{background:#7c2d12;color:#fb923c}
.main{flex:1;overflow-y:auto;padding:20px 24px}
.summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.card{background:#1e293b;border-radius:8px;padding:14px 16px;border:1px solid #334155}
.card .label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
.card .value{font-size:22px;font-weight:700;color:#f1f5f9;margin-top:4px}
.card .sub{font-size:11px;color:#94a3b8;margin-top:2px}
.card.critical{border-color:#dc2626}

.section-title{font-size:15px;font-weight:600;color:#cbd5e1;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid #334155}

.cp-badge.cp{background:#dc2626;color:#fecaca}
.cp-badge.nc{background:#d97706;color:#fef3c7}
.gantt-bars{flex:1;position:relative;padding:4px 0}
.bar{position:absolute;height:22px;border-radius:4px;top:4px;min-width:3px;cursor:pointer;transition:opacity .15s}
.bar:hover{opacity:.85;box-shadow:0 0 8px rgba(96,165,250,.4)}
.bar-tooltip{display:none;position:absolute;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;padding:10px 14px;z-index:100;font-size:11px;color:#e2e8f0;min-width:220px;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.bar:hover .bar-tooltip{display:block;bottom:30px;left:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding:10px 14px;background:#1e293b;border-radius:6px;border:1px solid #334155}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#94a3b8}
.legend-color{width:14px;height:14px;border-radius:3px}

.cp-summary h3{color:#ef4444;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.cp-table{width:100%;border-collapse:collapse;font-size:12px}
.cp-table th{text-align:left;padding:6px 10px;color:#64748b;border-bottom:1px solid #334155;font-weight:600}

.cp-table .slack-val{font-weight:700}
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.zone-card{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:14px;cursor:pointer;transition:all .15s}
.zone-card:hover{border-color:#3b82f6;transform:translateY(-1px)}

const PHASE_COLORS = {
  'Design': '#6366f1', 'Order': '#8b5cf6', 'Delivery': '#a78bfa',
  'Design + Order + Delivery': '#818cf8',
  'Construction': '#3b82f6', 'Ground Floor': '#2563eb', 'First Floor': '#60a5fa',
  'Mezzanine': '#38bdf8',
  'HVAC Equipment': '#06b6d4', 'Equipment Manufacturing': '#0891b2',
  'Equipment Setup': '#0d9488', 'Equipment install': '#14b8a6',
  'CDR': '#f59e0b', 'Hook up': '#f97316', 
  'Cold Commissioning': '#22d3ee', 'HOT Commissioning': '#ef4444',
  'Submission': '#a3e635', 'VOC': '#84cc16',
  'default': '#64748b'
};

function getPhaseColor(name) {
  for (let key in PHASE_COLORS) {
    if (name.includes(key)) return PHASE_COLORS[key];
  }
  return PHASE_COLORS.default;
}

function daysBetween(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}

function formatDate(d) {
  const parts = d.split('-');
  return parts[0].slice(2) + '.' + parts[1] + '.' + parts[2];
}

// Build sidebar
function buildSidebar() {
  const fa1El = document.getElementById('fa1-zones');
  const cp1El = document.getElementById('cp1-zones');
  
  Object.keys(DATA.zones).sort().forEach(key => {
    const z = DATA.zones[key];
    const btn = document.createElement('div');
    btn.className = 'zone-btn';
    btn.id = 'btn-' + key.replace(/[^a-zA-Z0-9]/g, '_');
    btn.onclick = () => showZone(key);
    const floorTag = z.floor === 'FF' ? '<span class="floor-tag floor-ff">FF</span>' : '<span class="floor-tag floor-gf">GF</span>';
    btn.innerHTML = z.zone.replace('CP1(','CP1 ').replace(')','') + ' ' + floorTag + '<span style="font-size:10px;color:#64748b">' + z.total + '</span>';
    
    if (z.building === 'FA1') fa1El.appendChild(btn);
    else cp1El.appendChild(btn);
  });
}

function setActive(id) {
  document.querySelectorAll('.zone-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function renderGantt(phases, cpAnalysis, timelineStart, timelineEnd) {
  const totalDays = daysBetween(timelineStart, timelineEnd);
  // Generate month markers
  let months = [];
  let d = new Date(timelineStart);
  d.setDate(1);
  while (d <= new Date(timelineEnd)) {
    months.push(d.toISOString().slice(0,7));
    d.setMonth(d.getMonth() + 1);
  }
  
  const criticalNames = new Set((cpAnalysis.critical || []).map(c => c.name));
  const nearCritNames = new Set((cpAnalysis.near_critical || []).map(c => c.name));
  
  let html = '<div class="gantt-container"><div class="gantt-header">';
  html += '<div class="gantt-label-col">Phase / Discipline</div>';
  html += '<div class="gantt-timeline">';
  months.forEach(m => {
    html += '<div class="gantt-month">' + m.slice(2) + '</div>';
  });
  html += '</div></div>';
  
  phases.forEach(p => {
    const isCrit = criticalNames.has(p.name);
    const isNearCrit = nearCritNames.has(p.name);
    const rowClass = isCrit ? 'gantt-row critical-row' : (isNearCrit ? 'gantt-row near-critical-row' : 'gantt-row');
    
    html += '<div class="' + rowClass + '">';
    html += '<div class="gantt-name">';
    if (isCrit) html += '<span class="cp-badge cp">CP</span>';
    else if (isNearCrit) html += '<span class="cp-badge nc">NC</span>';
    html += '<span title="' + p.name + '">' + p.name.slice(0,35) + '</span></div>';
    html += '<div class="gantt-bars">';
    
    const left = Math.max(0, (daysBetween(timelineStart, p.start) / totalDays) * 100);
    const width = Math.max(0.5, (daysBetween(p.start, p.finish) / totalDays) * 100);
    const color = getPhaseColor(p.name);
    const span = daysBetween(p.start, p.finish);
    
    html += '<div class="bar" style="left:' + left + '%;width:' + width + '%;background:' + color + '">';
    html += '<div class="bar-tooltip">';
    html += '<strong>' + p.name + '</strong><br>';
    html += 'Start: ' + formatDate(p.start) + '<br>';
    html += 'Finish: ' + formatDate(p.finish) + '<br>';
    html += 'Duration: ' + span + ' cal.days<br>';
    html += 'Activities: ' + p.count + '<br>';
    if (p.workdays) html += 'Work Days: ' + p.workdays + '<br>';
    if (p.contractors && p.contractors.length) html += 'Contractors: ' + p.contractors.join(', ');
    html += '</div></div>';
    
    html += '</div></div>';
  });
  html += '</div>';
  return html;
}

function showZone(key) {
  setActive('btn-' + key.replace(/[^a-zA-Z0-9]/g, '_'));
  const z = DATA.zones[key];
  const cp = DATA.cp_analysis[key];
  const span = daysBetween(z.min_start, z.max_finish);
  
  let html = '';
  
  // Summary cards
  html += '<div class="summary-cards">';
  html += '<div class="card"><div class="label">Zone</div><div class="value">' + z.zone + '</div><div class="sub">' + z.building + ' | ' + z.floor + '</div></div>';
  html += '<div class="card"><div class="label">Period</div><div class="value">' + formatDate(z.min_start) + '</div><div class="sub">~ ' + formatDate(z.max_finish) + ' (' + span + 'd)</div></div>';
  html += '<div class="card"><div class="label">Activities</div><div class="value">' + z.total + '</div><div class="sub">' + z.phases.length + ' phases</div></div>';
  html += '<div class="card critical"><div class="label">Critical Phases</div><div class="value">' + cp.critical.length + '</div><div class="sub">' + cp.near_critical.length + ' near-critical</div></div>';
  html += '</div>';
  
  // Critical Path Summary
  if (cp.critical.length || cp.near_critical.length) {
    html += '<div class="cp-summary"><h3>&#9888; Critical Path Analysis (TF &#8804; 5 days)</h3>';
    html += '<table class="cp-table"><tr><th>Phase</th><th>Start</th><th>Finish</th><th>Duration</th><th>Slack (days)</th><th>Status</th></tr>';
    cp.critical.forEach(c => {
      html += '<tr class="critical"><td>' + c.name + '</td><td>' + formatDate(c.start) + '</td><td>' + formatDate(c.finish) + '</td><td>' + c.span + 'd</td><td class="slack-val">' + c.slack + '</td><td class="risk-high">CRITICAL</td></tr>';
    });
    cp.near_critical.forEach(c => {
      html += '<tr class="near-critical"><td>' + c.name + '</td><td>' + formatDate(c.start) + '</td><td>' + formatDate(c.finish) + '</td><td>' + c.span + 'd</td><td class="slack-val">' + c.slack + '</td><td class="risk-med">NEAR-CRIT</td></tr>';
    });
    html += '</table></div>';
  }
  
  // Legend
  html += '<div class="legend">';
  const usedColors = new Set();
  z.phases.forEach(p => {
    const c = getPhaseColor(p.name);
    if (!usedColors.has(c)) {
      usedColors.add(c);
      let label = p.name.length > 30 ? p.name.slice(0,30) + '...' : p.name;
      html += '<div class="legend-item"><div class="legend-color" style="background:' + c + '"></div>' + label + '</div>';
    }
  });
  html += '<div class="legend-item"><div class="legend-color" style="background:#dc2626;border:2px solid #fca5a5"></div>Critical Path</div>';
  html += '<div class="legend-item"><div class="legend-color" style="background:#d97706;border:2px solid #fcd34d"></div>Near-Critical</div>';
  html += '</div>';
  
  // Phase-level Gantt
  html += '<div class="section-title">Phase-Level Schedule (Gantt Chart)</div>';
  html += renderGantt(z.phases, cp, z.min_start, z.max_finish);
  
  // Discipline detail per phase
  if (z.details) {
    html += '<div class="section-title">Discipline Detail by Phase</div>';
    Object.keys(z.details).forEach(phaseName => {
      const details = z.details[phaseName];
      if (details && details.length > 1) {
        html += '<div style="margin:8px 0 4px;font-size:12px;color:#60a5fa;font-weight:600">' + phaseName + '</div>';
        const detailPhases = details.map(d => ({...d, contractors: []}));
        const minS = details.reduce((a,b) => a.start < b.start ? a : b).start;
        const maxF = details.reduce((a,b) => a.finish > b.finish ? a : b).finish;
        html += renderGantt(detailPhases, {critical:[], near_critical:[]}, minS, maxF);
      }
    });
  }
  
  document.getElementById('main-content').innerHTML = html;
}

function showOverview() {
  setActive('btn-overview');
  let html = '<div class="section-title">All Zones Overview &mdash; FA1 + CP1 Buildings</div>';
  
  // Overview cards
  html += '<div class="overview-grid">';
  
  const allKeys = Object.keys(DATA.zones).sort();
  const globalMin = allKeys.reduce((a,k) => DATA.zones[k].min_start < a ? DATA.zones[k].min_start : a, '9999');
  const globalMax = allKeys.reduce((a,k) => DATA.zones[k].max_finish > a ? DATA.zones[k].max_finish : a, '0000');
  const globalSpan = daysBetween(globalMin, globalMax);
  
  allKeys.forEach(key => {
    const z = DATA.zones[key];
    const cp = DATA.cp_analysis[key];
    const span = daysBetween(z.min_start, z.max_finish);
    const startPct = (daysBetween(globalMin, z.min_start) / globalSpan) * 100;
    const widthPct = (span / globalSpan) * 100;
    const isHighRisk = cp.critical.length >= 2;
    
    html += '<div class="zone-card" onclick="showZone(\'' + key + '\')" style="' + (isHighRisk ? 'border-color:#dc262680' : '') + '">';
    html += '<h4>' + z.zone + ' <span class="floor-tag ' + (z.floor==='FF'?'floor-ff':'floor-gf') + '">' + z.floor + '</span>';
    if (isHighRisk) html += ' <span style="color:#ef4444;font-size:10px">&#9888; HIGH RISK</span>';
    html += '</h4>';
    html += '<div class="info">' + z.total + ' activities | ' + formatDate(z.min_start) + ' ~ ' + formatDate(z.max_finish) + ' (' + span + 'd)</div>';
    html += '<div class="info">Critical: ' + cp.critical.length + ' | Near-Critical: ' + cp.near_critical.length + '</div>';
    html += '<div class="mini-bar"><div class="mini-bar-fill" style="margin-left:' + startPct + '%;width:' + widthPct + '%;background:' + (isHighRisk ? '#ef4444' : '#3b82f6') + '"></div></div>';
    html += '</div>';
  });
  html += '</div>';
  
  // Master timeline
  html += '<div class="section-title">Master Timeline (All Zones)</div>';
  const masterPhases = allKeys.map(key => {
    const z = DATA.zones[key];
    return {
      name: z.zone + ' (' + z.floor + ')',
      start: z.min_start,
      finish: z.max_finish,
      count: z.total,
      workdays: 0,
      contractors: []
    };
  });
  
  // Build master CP analysis
  const masterCP = {critical: [], near_critical: []};
  allKeys.forEach(key => {
    const cp = DATA.cp_analysis[key];
    const z = DATA.zones[key];
    if (cp.critical.length >= 2) {
      masterCP.critical.push({name: z.zone + ' (' + z.floor + ')', start: z.min_start, finish: z.max_finish, span: daysBetween(z.min_start, z.max_finish), slack: 0});
    }
  });
  
  html += renderGantt(masterPhases, masterCP, globalMin, globalMax);
  
  document.getElementById('main-content').innerHTML = html;
}

function showCompTab(btn, filter) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  const allKeys = Object.keys(DATA.zones).sort().filter(k => {
    if (filter === 'fa1') return DATA.zones[k].building === 'FA1';
    if (filter === 'cp1') return DATA.zones[k].building === 'CP1';
    return true;
  });
  
  let html = '<table class="compare-table">';
  html += '<tr><th>Zone</th><th>Floor</th><th>Start</th><th>Finish</th><th>Span (d)</th><th>Activities</th><th>Phases</th><th>Critical</th><th>Near-Crit</th><th>Risk</th></tr>';
  
  allKeys.forEach(key => {
    const z = DATA.zones[key];
    const cp = DATA.cp_analysis[key];
    const span = daysBetween(z.min_start, z.max_finish);
    const risk = cp.critical.length >= 2 ? 'HIGH' : (cp.near_critical.length > 0 ? 'MED' : 'LOW');
    const riskClass = risk === 'HIGH' ? 'risk-high' : (risk === 'MED' ? 'risk-med' : 'risk-low');
    
    html += '<tr>';
    html += '<td style="cursor:pointer;color:#60a5fa" onclick="showZone(\'' + key + '\')">' + z.zone + '</td>';
    html += '<td><span class="floor-tag ' + (z.floor==='FF'?'floor-ff':'floor-gf') + '">' + z.floor + '</span></td>';
    html += '<td>' + formatDate(z.min_start) + '</td>';
    html += '<td>' + formatDate(z.max_finish) + '</td>';
    html += '<td>' + span + '</td>';
    html += '<td>' + z.total + '</td>';
    html += '<td>' + z.phases.length + '</td>';
    html += '<td>' + cp.critical.length + '</td>';
    html += '<td>' + cp.near_critical.length + '</td>';
    html += '<td class="' + riskClass + '">' + risk + '</td>';
    html += '</tr>';
  });
  html += '</table>';
  
  // Key findings
  html += '<div style="margin-top:20px;padding:14px;background:#1e293b;border:1px solid #334155;border-radius:8px">';
  html += '<div style="font-size:13px;color:#60a5fa;font-weight:600;margin-bottom:8px">Key Findings</div>';
  
  // Find latest finishing zones
  const sorted = allKeys.map(k => ({key:k, ...DATA.zones[k], cp: DATA.cp_analysis[k]})).sort((a,b) => b.max_finish.localeCompare(a.max_finish));
  html += '<div style="font-size:12px;color:#cbd5e1;line-height:1.8">';
  html += '&#8226; <strong>Latest Completion:</strong> ' + sorted[0].zone + ' (' + sorted[0].floor + ') @ ' + formatDate(sorted[0].max_finish) + '<br>';
  html += '&#8226; <strong>Earliest Completion:</strong> ' + sorted[sorted.length-1].zone + ' (' + sorted[sorted.length-1].floor + ') @ ' + formatDate(sorted[sorted.length-1].max_finish) + '<br>';
  
  const highRisk = sorted.filter(s => s.cp.critical.length >= 2);
  if (highRisk.length) {
    html += '&#8226; <strong style="color:#ef4444">High Risk Zones:</strong> ' + highRisk.map(h => h.zone + '(' + h.floor + ')').join(', ') + '<br>';
  }
  
  // Compare FA1 modules
  const fa1Zones = sorted.filter(s => s.building === 'FA1' && s.floor === 'GF');
  if (fa1Zones.length > 1) {
    const finishDiff = daysBetween(fa1Zones[fa1Zones.length-1].max_finish, fa1Zones[0].max_finish);
    html += '&#8226; <strong>FA1 Module Spread (GF):</strong> ' + finishDiff + ' days between earliest and latest module completion<br>';
  }
  
  html += '</div></div>';
  
  document.getElementById('comp-content').innerHTML = html;
}

// Init
buildSidebar();
showOverview();
</script>
