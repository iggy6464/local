<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>BSI K-ENSOL Knowledge Graph</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0f172a; color:#e2e8f0; font-family:'Segoe UI',sans-serif; overflow:hidden; }
#graph { width:100vw; height:100vh; }
.tooltip { position:absolute; background:rgba(15,23,42,0.95); border:1px solid #334155; padding:10px 14px; border-radius:8px; font-size:12px; pointer-events:none; max-width:300px; z-index:100; }
.tooltip h3 { color:#38bdf8; font-size:14px; margin-bottom:4px; }
.tooltip .type { color:#94a3b8; font-size:11px; text-transform:uppercase; letter-spacing:1px; }
.tooltip .tags { color:#64748b; font-size:10px; margin-top:4px; }
.legend { position:fixed; top:16px; right:16px; background:rgba(15,23,42,0.9); border:1px solid #334155; border-radius:10px; padding:14px 18px; }
.legend h3 { font-size:13px; color:#94a3b8; margin-bottom:8px; }
.legend-item { display:flex; align-items:center; gap:8px; margin-bottom:4px; font-size:12px; }
.legend-dot { width:12px; height:12px; border-radius:50%; }
.header { position:fixed; top:16px; left:16px; }
.header h1 { font-size:20px; color:#38bdf8; }
.header p { font-size:11px; color:#64748b; }
.stats { position:fixed; bottom:16px; left:16px; font-size:11px; color:#475569; }
</style>
</head>
<body>
<div class="header">
  <h1>BSI K-ENSOL Knowledge Graph</h1>
  <p>24 nodes · 86 edges · LLM-Wiki Compatible</p>
</div>
<div class="legend">
  <h3>Node Types</h3>
  <div class="legend-item"><div class="legend-dot" style="background:#f472b6"></div> Source</div>
  <div class="legend-item"><div class="legend-dot" style="background:#38bdf8"></div> Entity</div>
  <div class="legend-item"><div class="legend-dot" style="background:#a78bfa"></div> Concept</div>
  <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div> Synthesis</div>
  <div class="legend-item"><div class="legend-dot" style="background:#fbbf24"></div> Index/Overview</div>
</div>
<div class="stats" id="stats"></div>
<svg id="graph"></svg>
<div class="tooltip" id="tooltip" style="display:none"></div>

<script>
const graphData = {"nodes": [{"id": "overview", "title": "Overview", "type": "overview", "tags": [], "location": "root"}, {"id": "index", "title": "Index", "type": "index", "tags": [], "location": "root"}, {"id": "CP1-Building", "title": "CP1 Building", "type": "entity", "tags": ["building", "common-process", "deadline-CW40"], "location": "entities"}, {"id": "Construction-Maven", "title": "Construction Maven", "type": "entity", "tags": ["tool", "AI", "platform", "risk-management"], "location": "entities"}, {"id": "BSI-K-ENSOL", "title": "BSI K-ENSOL Project", "type": "entity", "tags": ["project", "EPC", "battery-factory", "Spain"], "location": "entities"}, {"id": "GEMTECH", "title": "GEMTECH", "type": "entity", "tags": ["subcontractor", "civil", "architecture"], "location": "entities"}, {"id": "MTL-Dashboard", "title": "MTL Dashboard", "type": "entity", "tags": ["tool", "dashboard", "HTML", "material-tracking"], "location": "entities"}, {"id": "SOLTEC", "title": "SOLTEC", "type": "entity", "tags": ["subcontractor", "electrical", "instrumentation", "BMS"], "location": "entities"}, {"id": "FA1-Building", "title": "FA1 Building", "type": "entity", "tags": ["building", "factory", "deadline-CW33"], "location": "entities"}, {"id": "project-knowledge-overview", "title": "Project Knowledge Overview", "type": "synthesis", "tags": ["overview", "cross-cutting"], "location": "syntheses"}, {"id": "cdr-status-dashboard", "title": "CDR Status Dashboard", "type": "source", "tags": ["dashboard", "CDR", "construction-readiness"], "location": "sources"}, {"id": "schedule-conflict-optimization", "title": "Schedule Conflict Optimization", "type": "source", "tags": ["schedule", "clash-detection", "trade-sequencing", "SCN"], "location": "sources"}, {"id": "mtl-dashboard-development", "title": "MTL Dashboard 개발 이력", "type": "source", "tags": ["dashboard", "material", "tracking", "HTML", "JavaScript"], "location": "sources"}, {"id": "colleague-skill-epc-adaptation", "title": "colleague.skill EPC Adaptation", "type": "source", "tags": ["AI", "knowledge-management", "tacit-knowledge", "skill-framework"], "location": "sources"}, {"id": "cw16-cw20-catchup-plan", "title": "CW16~CW20 Catch-Up Plan Analysis", "type": "source", "tags": ["catch-up", "material-gap", "manpower", "SOLTEC", "LLI"], "location": "sources"}, {"id": "construction-maven-system", "title": "Construction Maven System", "type": "source", "tags": ["AI", "risk-management", "DoD-Maven", "OCR"], "location": "sources"}, {"id": "Material-Pipeline-Logic", "title": "Material Pipeline Logic", "type": "concept", "tags": ["material", "pipeline", "tracking", "5-stage"], "location": "concepts"}, {"id": "Critical-Path-Method", "title": "Critical Path Method", "type": "concept", "tags": ["CPM", "scheduling", "float", "forward-pass", "backward-pass"], "location": "concepts"}, {"id": "I-MR-Analysis", "title": "I-MR Analysis", "type": "concept", "tags": ["SPC", "statistics", "forecasting", "quality-control"], "location": "concepts"}, {"id": "Trade-Sequencing", "title": "Trade Sequencing", "type": "concept", "tags": ["MEP", "clash-detection", "scheduling", "zone-rolling"], "location": "concepts"}, {"id": "FIDIC-Silver-Book", "title": "FIDIC Silver Book", "type": "concept", "tags": ["contract", "FIDIC", "EPC", "risk-allocation"], "location": "concepts"}, {"id": "CDR-Readiness-Milestone", "title": "CDR Readiness Milestone", "type": "concept", "tags": ["CDR", "milestone", "invariant", "start-date"], "location": "concepts"}, {"id": "LLI-Criticality", "title": "LLI Criticality Assessment", "type": "concept", "tags": ["LLI", "long-lead", "procurement", "tiering"], "location": "concepts"}, {"id": "EPC-Domain-Invariants", "title": "EPC Domain Invariants", "type": "concept", "tags": ["invariant", "domain-rule", "verification"], "location": "concepts"}], "edges": [{"source": "overview", "target": "FA1-Building"}, {"source": "overview", "target": "CP1-Building"}, {"source": "overview", "target": "MTL-Dashboard"}, {"source": "overview", "target": "Material-Pipeline-Logic"}, {"source": "overview", "target": "SOLTEC"}, {"source": "overview", "target": "LLI-Criticality"}, {"source": "overview", "target": "Critical-Path-Method"}, {"source": "overview", "target": "Trade-Sequencing"}, {"source": "overview", "target": "I-MR-Analysis"}, {"source": "overview", "target": "CDR-Readiness-Milestone"}, {"source": "overview", "target": "Construction-Maven"}, {"source": "overview", "target": "EPC-Domain-Invariants"}, {"source": "overview", "target": "FIDIC-Silver-Book"}, {"source": "index", "target": "mtl-dashboard-development"}, {"source": "index", "target": "cdr-status-dashboard"}, {"source": "index", "target": "construction-maven-system"}, {"source": "index", "target": "cw16-cw20-catchup-plan"}, {"source": "index", "target": "schedule-conflict-optimization"}, {"source": "index", "target": "colleague-skill-epc-adaptation"}, {"source": "index", "target": "BSI-K-ENSOL"}, {"source": "index", "target": "FA1-Building"}, {"source": "index", "target": "CP1-Building"}, {"source": "index", "target": "GEMTECH"}, {"source": "index", "target": "SOLTEC"}, {"source": "index", "target": "MTL-Dashboard"}, {"source": "index", "target": "Construction-Maven"}, {"source": "index", "target": "Critical-Path-Method"}, {"source": "index", "target": "FIDIC-Silver-Book"}, {"source": "index", "target": "CDR-Readiness-Milestone"}, {"source": "index", "target": "I-MR-Analysis"}, {"source": "index", "target": "LLI-Criticality"}, {"source": "index", "target": "Material-Pipeline-Logic"}, {"source": "index", "target": "EPC-Domain-Invariants"}, {"source": "index", "target": "Trade-Sequencing"}, {"source": "index", "target": "project-knowledge-overview"}, {"source": "CP1-Building", "target": "BSI-K-ENSOL"}, {"source": "CP1-Building", "target": "FA1-Building"}, {"source": "Construction-Maven", "target": "FIDIC-Silver-Book"}, {"source": "BSI-K-ENSOL", "target": "FA1-Building"}, {"source": "BSI-K-ENSOL", "target": "CP1-Building"}, {"source": "BSI-K-ENSOL", "target": "GEMTECH"}, {"source": "BSI-K-ENSOL", "target": "SOLTEC"}, {"source": "BSI-K-ENSOL", "target": "FIDIC-Silver-Book"}, {"source": "MTL-Dashboard", "target": "Material-Pipeline-Logic"}, {"source": "MTL-Dashboard", "target": "I-MR-Analysis"}, {"source": "SOLTEC", "target": "FA1-Building"}, {"source": "FA1-Building", "target": "SOLTEC"}, {"source": "FA1-Building", "target": "CDR-Readiness-Milestone"}, {"source": "FA1-Building", "target": "BSI-K-ENSOL"}, {"source": "FA1-Building", "target": "CP1-Building"}, {"source": "project-knowledge-overview", "target": "MTL-Dashboard"}, {"source": "project-knowledge-overview", "target": "Critical-Path-Method"}, {"source": "project-knowledge-overview", "target": "I-MR-Analysis"}, {"source": "project-knowledge-overview", "target": "LLI-Criticality"}, {"source": "project-knowledge-overview", "target": "EPC-Domain-Invariants"}, {"source": "cdr-status-dashboard", "target": "CDR-Readiness-Milestone"}, {"source": "cdr-status-dashboard", "target": "FA1-Building"}, {"source": "cdr-status-dashboard", "target": "CP1-Building"}, {"source": "schedule-conflict-optimization", "target": "Trade-Sequencing"}, {"source": "mtl-dashboard-development", "target": "MTL-Dashboard"}, {"source": "mtl-dashboard-development", "target": "Material-Pipeline-Logic"}, {"source": "mtl-dashboard-development", "target": "LLI-Criticality"}, {"source": "mtl-dashboard-development", "target": "CDR-Readiness-Milestone"}, {"source": "colleague-skill-epc-adaptation", "target": "Construction-Maven"}, {"source": "colleague-skill-epc-adaptation", "target": "Construction-Maven"}, {"source": "cw16-cw20-catchup-plan", "target": "SOLTEC"}, {"source": "cw16-cw20-catchup-plan", "target": "FA1-Building"}, {"source": "cw16-cw20-catchup-plan", "target": "LLI-Criticality"}, {"source": "cw16-cw20-catchup-plan", "target": "LLI-Criticality"}, {"source": "cw16-cw20-catchup-plan", "target": "SOLTEC"}, {"source": "construction-maven-system", "target": "FIDIC-Silver-Book"}, {"source": "construction-maven-system", "target": "Construction-Maven"}, {"source": "construction-maven-system", "target": "Critical-Path-Method"}, {"source": "construction-maven-system", "target": "FIDIC-Silver-Book"}, {"source": "Material-Pipeline-Logic", "target": "MTL-Dashboard"}, {"source": "Material-Pipeline-Logic", "target": "EPC-Domain-Invariants"}, {"source": "Critical-Path-Method", "target": "Trade-Sequencing"}, {"source": "Critical-Path-Method", "target": "CDR-Readiness-Milestone"}, {"source": "Trade-Sequencing", "target": "Critical-Path-Method"}, {"source": "FIDIC-Silver-Book", "target": "EPC-Domain-Invariants"}, {"source": "CDR-Readiness-Milestone", "target": "EPC-Domain-Invariants"}, {"source": "LLI-Criticality", "target": "SOLTEC"}, {"source": "LLI-Criticality", "target": "SOLTEC"}, {"source": "EPC-Domain-Invariants", "target": "CDR-Readiness-Milestone"}, {"source": "EPC-Domain-Invariants", "target": "Material-Pipeline-Logic"}, {"source": "EPC-Domain-Invariants", "target": "CDR-Readiness-Milestone"}]};

const colorMap = {
  source:'#f472b6', entity:'#38bdf8', concept:'#a78bfa',
  synthesis:'#4ade80', index:'#fbbf24', overview:'#fbbf24', unknown:'#64748b'
};
const sizeMap = {
  source:8, entity:10, concept:9, synthesis:7, index:14, overview:12, unknown:6
};

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select('#graph').attr('width',width).attr('height',height);
const g = svg.append('g');
svg.call(d3.zoom().scaleExtent([0.2,5]).on('zoom', e => g.attr('transform',e.transform)));

const sim = d3.forceSimulation(graphData.nodes)
  .force('link', d3.forceLink(graphData.edges).id(d=>d.id).distance(80))
  .force('charge', d3.forceManyBody().strength(-200))
  .force('center', d3.forceCenter(width/2, height/2))
  .force('collision', d3.forceCollide().radius(d => (sizeMap[d.type]||6)+5));

const link = g.append('g').selectAll('line').data(graphData.edges).join('line')
  .attr('stroke','#1e293b').attr('stroke-width',1).attr('stroke-opacity',0.6);

const node = g.append('g').selectAll('circle').data(graphData.nodes).join('circle')
  .attr('r', d => sizeMap[d.type]||6)
  .attr('fill', d => colorMap[d.type]||'#64748b')
  .attr('stroke','#0f172a').attr('stroke-width',1.5)
  .style('cursor','pointer')
  .call(d3.drag().on('start',ds).on('drag',dd).on('end',de));

const label = g.append('g').selectAll('text').data(graphData.nodes).join('text')
  .text(d => d.title.length > 25 ? d.title.slice(0,22)+'...' : d.title)
  .attr('font-size','9px').attr('fill','#94a3b8').attr('text-anchor','middle').attr('dy','1.5em');

const tooltip = d3.select('#tooltip');
node.on('mouseover', (e,d) => {
  const conns = graphData.edges.filter(l => l.source.id===d.id || l.target.id===d.id).length;
  tooltip.style('display','block').html(`
    <h3>${d.title}</h3>
    <div class="type">${d.type} · ${d.location}</div>
    <div class="tags">${d.tags.join(', ')}</div>
    <div style="margin-top:6px;color:#cbd5e1">Connections: ${conns}</div>
  `);
  link.attr('stroke', l => (l.source.id===d.id||l.target.id===d.id)?'#38bdf8':'#1e293b')
      .attr('stroke-width', l => (l.source.id===d.id||l.target.id===d.id)?2:1);
  node.attr('opacity', n => {
    if(n.id===d.id) return 1;
    return graphData.edges.some(l => (l.source.id===d.id&&l.target.id===n.id)||(l.target.id===d.id&&l.source.id===n.id))?1:0.2;
  });
  label.attr('opacity', n => {
    if(n.id===d.id) return 1;
    return graphData.edges.some(l => (l.source.id===d.id&&l.target.id===n.id)||(l.target.id===d.id&&l.source.id===n.id))?1:0.1;
  });
}).on('mousemove', e => {
  tooltip.style('left',(e.pageX+15)+'px').style('top',(e.pageY-10)+'px');
}).on('mouseout', () => {
  tooltip.style('display','none');
  link.attr('stroke','#1e293b').attr('stroke-width',1);
  node.attr('opacity',1);
  label.attr('opacity',1);
});

sim.on('tick', () => {
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('cx',d=>d.x).attr('cy',d=>d.y);
  label.attr('x',d=>d.x).attr('y',d=>d.y);
});

function ds(e,d){if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y;}
function dd(e,d){d.fx=e.x; d.fy=e.y;}
function de(e,d){if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null;}

document.getElementById('stats').textContent = `${graphData.nodes.length} nodes · ${graphData.edges.length} edges · Drag to move · Scroll to zoom`;
</script>
</body>
</html>
